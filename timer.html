<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>האתר שלי</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      direction: rtl;
      background: #ffffff;
    }

    .top-bar {
      width: 100%;
      min-height: 84px;
      background: #6f42c1;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 32px;

      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
    }

    .site-title {
      margin: 0;

      color: white;
      font-size: 32px;
      font-weight: 700;

      letter-spacing: 0.2px;
    }

    .home-button {
      width: 50px;
      height: 50px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 23px;
      text-decoration: none;

      border-radius: 14px;
      background: rgba(255, 255, 255, 0.14);

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .home-button:hover {
      background: white;
      color: #6f42c1;

      transform: translateY(-2px);

      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.18);
    }

    .content {
      padding-top: 80px;
    }

    @media (max-width: 600px) {
      .top-bar {
        min-height: 72px;
        padding: 0 18px;
      }

      .site-title {
        font-size: 24px;
      }

      .home-button {
        width: 44px;
        height: 44px;
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar">

    <h1 class="site-title">
     טיימר
    </h1>

    <a
      class="home-button"
      href="https://www.forshner.fyi"
      title="דף הבית"
    >
      <i class="fa-solid fa-house"></i>
    </a>

  </div>

  <div class="content">

<div style="font-family:Arial; direction:rtl; text-align:center; max-width:320px; margin:auto;">

  <!-- אזור הגדרות -->
  <div style="display:flex; justify-content:center; gap:20px; margin-bottom:15px; align-items:center;">

    <div>
      דקות:<br>
      <input id="minInput" type="number" min="0" value="5"
             style="width:60px; text-align:center;">
    </div>

    <div>
      שניות:<br>
      <input id="secInput" type="number" min="0" max="59" value="0"
             style="width:60px; text-align:center;">
    </div>

    <!-- אייקון צליל -->
    <div onclick="toggleMute()" 
         style="font-size:28px; cursor:pointer; user-select:none;"
         id="muteIcon">
      🔊
    </div>

  </div>

  <!-- תצוגת זמן -->
  <div id="display" style="
        font-size:64px; 
        font-weight:bold; 
        margin-bottom:5px;
        background:#f5f5f5; 
        border:1px solid #aaa; 
        padding:10px; 
        border-radius:6px;">
    05:00
  </div>

  <!-- כיתוב "דקות" שמופיע רק במצב ללא שניות -->
  <div id="minutesLabel" style="
        font-size:28px; 
        font-weight:bold; 
        color:#555; 
        height:32px; 
        margin-bottom:20px;">
  </div>

  <!-- כפתורים -->
  <button onclick="startTimer()" style="padding:6px 12px;">התחל</button>
  <button onclick="pauseTimer()" style="padding:6px 12px;">עצור</button>
  <button onclick="resumeTimer()" style="padding:6px 12px;">המשך</button>
  <button onclick="resetTimer()" style="padding:6px 12px;">איפוס</button>
  <button onclick="toggleHideSeconds()" id="hideSecondsBtn" style="padding:6px 12px;">הסתר שניות</button>

</div>

<script>
let interval = null;
let remaining = 0;
let paused = false;
let muted = false;
let hideSeconds = false;

function toggleHideSeconds() {
  hideSeconds = !hideSeconds;
  document.getElementById("hideSecondsBtn").innerText = hideSeconds ? "הצג שניות" : "הסתר שניות";
  updateDisplay();
}

function startTimer() {
  const min = parseInt(document.getElementById("minInput").value, 10) || 0;
  const sec = parseInt(document.getElementById("secInput").value, 10) || 0;

  remaining = min * 60 + sec;
  paused = false;

  if (remaining <= 0) {
    document.getElementById("display").innerText = "00:00";
    return;
  }

  if (interval) clearInterval(interval);

  updateDisplay();
  interval = setInterval(tick, 1000);
}

function tick() {
  if (paused) return;

  remaining--;
  updateDisplay();

  if (remaining <= 0) {
    clearInterval(interval);
    interval = null;
    beep();
  }
}

function pauseTimer() {
  paused = true;
}

function resumeTimer() {
  if (!interval) interval = setInterval(tick, 1000);
  paused = false;
}

function resetTimer() {
  if (interval) {
    clearInterval(interval);
    interval = null;
  }

  paused = false;

  const min = parseInt(document.getElementById("minInput").value, 10) || 0;
  const sec = parseInt(document.getElementById("secInput").value, 10) || 0;

  remaining = min * 60 + sec;

  document.getElementById("display").style.color = "black";
  document.getElementById("minutesLabel").innerText = "";

  let m = String(min).padStart(2, "0");
  let s = String(sec).padStart(2, "0");
  document.getElementById("display").innerText = `${m}:${s}`;
}

function updateDisplay() {
  let m = Math.floor(remaining / 60);
  let s = remaining % 60;

  // צבע אזהרה
  document.getElementById("display").style.color =
      remaining <= 15 ? "orange" : "black";

  // עיצוב ספרות
  m = String(m).padStart(2, "0");
  s = String(s).padStart(2, "0");

  // האם להסתיר שניות?
  if (hideSeconds && remaining >= 60) {
    document.getElementById("display").innerText = `${m}`;
    document.getElementById("minutesLabel").innerText = "דקות";
  } else {
    document.getElementById("display").innerText = `${m}:${s}`;
    document.getElementById("minutesLabel").innerText = "";
  }
}

function beep() {
  if (muted) return;
  const snd = new Audio("https://rforshner.github.io/mp3/triumphant_jingle.mp3");
  snd.play();
}

function toggleMute() {
  muted = !muted;
  document.getElementById("muteIcon").innerText = muted ? "🔇" : "🔊";
}
</script>

  </div>

</body>
</html>
