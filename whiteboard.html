<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>whiteboard</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      direction: rtl;
      background: #ffffff;
    }

    .top-bar {
      width: 100%;
      min-height: 84px;
      background: #6f42c1;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 32px;

      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
    }

    .site-title {
      margin: 0;

      color: white;
      font-size: 32px;
      font-weight: 700;

      letter-spacing: 0.2px;
    }

    .home-button {
      width: 50px;
      height: 50px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 23px;
      text-decoration: none;

      border-radius: 14px;
      background: rgba(255, 255, 255, 0.14);

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .home-button:hover {
      background: white;
      color: #6f42c1;

      transform: translateY(-2px);

      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.18);
    }

    .content {
      padding-top: 80px;
    }

    @media (max-width: 600px) {
      .top-bar {
        min-height: 72px;
        padding: 0 18px;
      }

      .site-title {
        font-size: 24px;
      }

      .home-button {
        width: 44px;
        height: 44px;
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar">

    <h1 class="site-title">
     לוח טקסט
    </h1>

    <a
      class="home-button"
      href="https://www.forshner.fyi"
      title="דף הבית"
    >
      <i class="fa-solid fa-house"></i>
    </a>

  </div>

  <div class="content">

<textarea id="writebox"></textarea>
<input type="range" id="fontSlider" min="24" max="120" value="72">

<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
  }

  #writebox {
    width: 100%;
    height: 100vh;
    box-sizing: border-box;
    border: none;
    outline: none;
    resize: none;
    font-size: 72px;
    font-family: Arial, sans-serif;
    direction: rtl;
    text-align: right;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    padding: 16px;
  }

  #fontSlider {
    position: fixed;
    bottom: 8px;
    left: 8px;
    width: 120px;
    height: 12px;
    opacity: 0.6;
  }
</style>

<script>
  const box = document.getElementById('writebox');
  const slider = document.getElementById('fontSlider');

  slider.addEventListener('input', () => {
    box.style.fontSize = slider.value + 'px';
  });
</script>
  </div>

</body>
</html>
