<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>תפריט</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      direction: rtl;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .grid {
      width: min(1200px, 92vw);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }

    .button {
      min-height: 200px;
      background: white;
      color: #222;
      border-radius: 22px;
      text-decoration: none;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 20px;

      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease,
        color 0.2s ease;
    }

    .button i {
      font-size: 62px;
      transition: transform 0.2s ease;
    }

    .button span {
      font-size: 24px;
      font-weight: 700;
    }

    .button:hover {
      transform: translateY(-7px) scale(1.025);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
      background: #222;
      color: white;
    }

    .button:hover i {
      transform: scale(1.15);
    }

    @media (max-width: 1000px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 450px) {
      body {
        padding: 20px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .button {
        min-height: 165px;
      }

      .button i {
        font-size: 54px;
      }

      .button span {
        font-size: 22px;
      }
    }
    .code-popup {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);

  display: flex;
  align-items: center;
  justify-content: center;

  opacity: 0;
  visibility: hidden;

  transition: 0.2s ease;

  z-index: 9999;
}

.code-popup.show {
  opacity: 1;
  visibility: visible;
}

.code-box {
  position: relative;

  width: min(360px, 90vw);

  background: white;
  border-radius: 22px;

  padding: 35px 30px 30px;

  text-align: center;

  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);

  transform: scale(0.92);

  transition: transform 0.2s ease;
}

.code-popup.show .code-box {
  transform: scale(1);
}

.close-popup {
  position: absolute;

  top: 12px;
  left: 14px;

  border: none;
  background: transparent;

  font-size: 28px;
  cursor: pointer;

  color: #777;
}

.close-popup:hover {
  color: #222;
}

.popup-lock {
  font-size: 45px;
  color: #6f42c1;

  margin-bottom: 10px;
}

.code-box h2 {
  margin: 5px 0 20px;

  font-size: 24px;
}

#codeInput {
  width: 100%;

  padding: 14px;

  border: 2px solid #ddd;
  border-radius: 12px;

  font-size: 26px;
  text-align: center;

  letter-spacing: 10px;

  outline: none;

  direction: ltr;

  transition: border 0.2s ease;
}

#codeInput:focus {
  border-color: #6f42c1;
}

.submit-code {
  width: 100%;

  margin-top: 15px;
  padding: 13px;

  border: none;
  border-radius: 12px;

  background: #6f42c1;
  color: white;

  font-size: 18px;
  font-weight: bold;

  cursor: pointer;

  transition: 0.2s ease;
}

.submit-code:hover {
  background: #59359b;
  transform: translateY(-1px);
}

#codeError {
  height: 22px;

  margin-top: 12px;

  color: #d93025;

  font-size: 15px;
}
  </style>
</head>

<body>

  <div class="grid">

    <a class="button" href="http://forshner.fyi/timer.html">
      <i class="fa-solid fa-stopwatch"></i>
      <span>טיימר</span>
    </a>

    <a class="button" href="http://forshner.fyi/nakdan.html">
      <i class="fa-solid fa-pen-fancy"></i>
      <span>נקדן</span>
    </a>

    <a class="button" href="http://forshner.fyi/whiteboard.html">
      <i class="fa-solid fa-chalkboard-user"></i>
      <span>לוח טקסט</span>
    </a>

    <a class="button" href="http://forshner.fyi/timer.html">
      <i class="fa-solid fa-image"></i>
      <span>כפתור 4</span>
    </a>

    <a class="button" href="#">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>כפתור 5</span>
    </a>

    <a class="button" href="#">
      <i class="fa-solid fa-pen"></i>
      <span>כפתור 6</span>
    </a>

    <a class="button" href="#">
      <i class="fa-solid fa-folder"></i>
      <span>כפתור 7</span>
    </a>

    <a class="button" href="#">
      <i class="fa-solid fa-graduation-cap"></i>
      <span>כפתור 8</span>
    </a>

<a class="button" href="#" onclick="openCodePopup(event)">
  <i class="fa-solid fa-lock"></i>
  <span>כפתור 9</span>
</a>

    <a class="button" href="#">
      <i class="fa-solid fa-calendar"></i>
      <span>כפתור 10</span>
    </a>

    <a class="button" href="#">
      <i class="fa-solid fa-link"></i>
      <span>כפתור 11</span>
    </a>

    <a class="button" href="#">
      <i class="fa-solid fa-toolbox"></i>
      <span>כפתור 12</span>
    </a>

  </div>

<div id="codePopup" class="code-popup">
  <div class="code-box">
    <button class="close-popup" onclick="closeCodePopup()">×</button>

    <i class="fa-solid fa-lock popup-lock"></i>

    <h2>הכנס קוד</h2>

    <input
      type="password"
      id="codeInput"
      maxlength="4"
      inputmode="numeric"
      placeholder="••••"
      onkeydown="if(event.key === 'Enter') checkCode()"
    >

    <button class="submit-code" onclick="checkCode()">
      כניסה
    </button>

    <div id="codeError"></div>
  </div>
</div>

<script>
  function openCodePopup(event) {
    event.preventDefault();

    document.getElementById("codePopup").classList.add("show");
    document.getElementById("codeInput").value = "";
    document.getElementById("codeError").textContent = "";

    setTimeout(() => {
      document.getElementById("codeInput").focus();
    }, 100);
  }

  function closeCodePopup() {
    document.getElementById("codePopup").classList.remove("show");
  }

  function checkCode() {
    const code = document.getElementById("codeInput").value;
    const error = document.getElementById("codeError");

    if (code === "1234") {
      window.location.href = "https://rforshner.github.io/psik-table/";
    } else {
      error.textContent = "קוד שגוי";
    }
  }

  document.getElementById("codePopup").addEventListener("click", function(event) {
    if (event.target === this) {
      closeCodePopup();
    }
  });
</script>

</body>
</html>
