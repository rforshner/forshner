<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>תפריט</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      direction: rtl;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .grid {
      width: min(1200px, 92vw);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }

    .button {
      min-height: 200px;
      background: white;
      color: #222;
      border-radius: 22px;
      text-decoration: none;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 20px;

      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease,
        color 0.2s ease;
    }

    .button i {
      font-size: 62px;
      transition: transform 0.2s ease;
    }

    .button span {
      font-size: 24px;
      font-weight: 700;
    }

    .button:hover {
      transform: translateY(-7px) scale(1.025);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
      background: #222;
      color: white;
    }

    .button:hover i {
      transform: scale(1.15);
    }

    @media (max-width: 1000px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 450px) {
      body {
        padding: 20px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .button {
        min-height: 165px;
      }

      .button i {
        font-size: 54px;
      }

      .button span {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="grid">

    <a class="button" href="#">
      <i class="fa-solid fa-house"></i>
      <span>כפתור 1</span>
    </a>

    <a class="button" href="#">
      <i class="fa-solid fa-book"></i>
      <span>כפתור 2</span>
    </a>

    <a class="button" href="#">
      <i class="fa-solid fa-file"></i>
      <span>כפתור 3</span>
    </a>

    <a class="button" href="#">
      <i class="fa-solid fa-image"></i>
      <span>כפתור 4</span>
    </a>

    <a class="button" href="#">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>כפתור 5</span>
    </a>

    <a class="button" href="#">
      <i class="fa-solid fa-pen"></i>
      <span>כפתור 6</span>
    </a>

    <a class="button" href="#">
      <i class="fa-solid fa-folder"></i>
      <span>כפתור 7</span>
    </a>

    <a class="button" href="#">
      <i class="fa-solid fa-graduation-cap"></i>
      <span>כפתור 8</span>
    </a>

    <a class="button" href="#">
      <i class="fa-solid fa-gear"></i>
      <span>כפתור 9</span>
    </a>

    <a class="button" href="#">
      <i class="fa-solid fa-calendar"></i>
      <span>כפתור 10</span>
    </a>

    <a class="button" href="#">
      <i class="fa-solid fa-link"></i>
      <span>כפתור 11</span>
    </a>

    <a class="button" href="#">
      <i class="fa-solid fa-toolbox"></i>
      <span>כפתור 12</span>
    </a>

  </div>

</body>
</html>
